# Builds all packages in Debian trixie, signs the repository with the key
# from the repository secrets and publishes it on GitHub Pages.
name: publish

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    container: debian:trixie
    steps:
      - name: Install build tools
        run: |
          apt-get update -qq
          apt-get install -y -qq --no-install-recommends \
            ca-certificates curl git unzip xz-utils zstd dpkg-dev apt-utils \
            gnupg gpgv python3 python3-venv libstdc++6 >/dev/null

      - uses: actions/checkout@v7

      - name: Cache upstream downloads
        uses: actions/cache@v6
        with:
          path: downloads
          key: downloads-${{ hashFiles('packages/*/versions.env', 'upstream/*.env') }}
          restore-keys: downloads-

      - name: Build and sign
        env:
          APT_SIGNING_KEY: ${{ secrets.APT_SIGNING_KEY }}
          APT_SIGNING_FPR: ${{ secrets.APT_SIGNING_FPR }}
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          ./build.sh
          du -sh public
          ls -l public/pool/main/*/

      - uses: actions/upload-pages-artifact@v5
        with:
          path: public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
